<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vidhu Astro Prediction - Birth Details Form</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Georgia', 'Segoe UI', Arial, sans-serif;
            background-color: #fffdf2;
            background-image:
                radial-gradient(circle at left center, rgba(212, 175, 55, 0.08) 0%, transparent 40%),
                radial-gradient(circle at right center, rgba(212, 175, 55, 0.08) 0%, transparent 40%);
            color: #2c3e2e;
            line-height: 1.6;
            padding: 30px 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 620px;
            margin: auto;
            background: #ffffff;
            padding: 35px 30px;
            border-radius: 12px;
            border: 2px solid #d4af37;
            box-shadow: 0 8px 24px rgba(10, 77, 32, 0.12);
        }

        .logo-container {
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 18px;
            border-bottom: 2px solid #ebd999;
        }

        .logo-container img {
            width: 220px;
            height: auto;
            border-radius: 8px;
            border: 1.5px solid #d4af37;
            padding: 6px;
            background: #ffffff;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }

        .brand-title {
            color: #073b18;
            font-size: 26px;
            font-weight: 700;
            margin: 10px 0 4px 0;
            text-align: center;
            letter-spacing: 0.5px;
        }

        .brand-subtitle {
            color: #4a5d4c;
            font-size: 13px;
            font-weight: 500;
            margin: 0 0 4px 0;
            text-align: center;
            font-style: italic;
        }

        .brand-tagline {
            color: #0d5225;
            font-size: 12px;
            font-weight: 600;
            margin: 0 0 10px 0;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 700;
            margin-bottom: 6px;
            font-size: 14px;
            color: #073b18;
        }

        input[type="text"], select {
            width: 100%;
            padding: 11px 12px;
            border: 1.5px solid #d0c495;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            background-color: #fffdf8;
            color: #1b261b;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: #0a5223;
            box-shadow: 0 0 6px rgba(10, 82, 35, 0.25);
            background-color: #ffffff;
        }

        .row-group {
            display: flex;
            gap: 10px;
        }

        .row-group select, .row-group input {
            flex: 1;
        }

        .search-btn {
            background: linear-gradient(180deg, #0a5223 0%, #053315 100%);
            color: #fff1b8;
            border: 1px solid #d4af37;
            padding: 11px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            transition: all 0.2s ease;
        }

        .search-btn:hover {
            background: linear-gradient(180deg, #0d612a 0%, #07421b 100%);
            color: #ffffff;
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.4);
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(180deg, #0a5223 0%, #053315 100%);
            color: #fff1b8;
            padding: 14px;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.6px;
            border: 1px solid #d4af37;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            text-transform: uppercase;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            transition: all 0.25s ease;
        }

        .submit-btn:hover {
            background: linear-gradient(180deg, #0d612a 0%, #07421b 100%);
            color: #ffffff;
            box-shadow: 0 6px 14px rgba(212, 175, 55, 0.4);
            border-color: #fce897;
        }

        .error-msg {
            color: #b71c1c;
            background-color: #ffebee;
            border: 1px solid #ffcdd2;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            margin-bottom: 20px;
            font-size: 14px;
        }

        #search_results_container {
            display: none;
            margin-top: 8px;
        }

        #city_select {
            height: 110px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-container">
        <img src="{{ url_for('static', filename='emblem.jpg') }}" alt="Emblem" onerror="this.style.display='none'">
        <div class="brand-title">Vidhu Astro Prediction</div>
        <div class="brand-subtitle">Where Traditional Astrology Meets Vidhu’s AI Intelligence</div>
        <div class="brand-tagline">— Powered by Vidhu Kutty</div>
    </div>

    {% if error %}
        <div class="error-msg">{{ error }}</div>
    {% endif %}

    <form action="/birth_chart" method="POST">
        <div class="form-group">
            <label for="person_name">Name / பெயர்:</label>
            <input type="text" id="person_name" name="person_name" placeholder="Enter Full Name" required>
        </div>

        <div class="form-group">
            <label for="dob_day">Date of Birth / பிறந்த தேதி:</label>
            <div class="row-group">
                <select id="dob_day" name="dob_day" required>
                    {% for d in range(1, 32) %}
                        <option value="{{ d }}">{{ d }}</option>
                    {% endfor %}
                </select>
                <select id="dob_month" name="dob_month" required>
                    <option value="01">January</option>
                    <option value="02">February</option>
                    <option value="03">March</option>
                    <option value="04">April</option>
                    <option value="05">May</option>
                    <option value="06">June</option>
                    <option value="07">July</option>
                    <option value="08">August</option>
                    <option value="09">September</option>
                    <option value="10">October</option>
                    <option value="11">November</option>
                    <option value="12" selected>December</option>
                </select>
                <input type="text" id="dob_year" name="dob_year" placeholder="YYYY" value="1990" required>
            </div>
        </div>

        <div class="form-group">
            <label for="tob_hour">Birth Time / பிறந்த நேரம்:</label>
            <div class="row-group">
                <select id="tob_hour" name="tob_hour" required>
                    {% for h in range(1, 13) %}
                        <option value="{{ h }}">{{ h }}</option>
                    {% endfor %}
                </select>
                <select id="tob_minute" name="tob_minute" required>
                    {% for m in range(0, 60) %}
                        <option value="{{ m }}">{{ m }}</option>
                    {% endfor %}
                </select>
                <select id="tob_ampm" name="tob_ampm" required>
                    <option value="AM">AM</option>
                    <option value="PM" selected>PM</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label for="place_search">Birth Place Search / பிறந்த இடம்:</label>
            <div class="row-group">
                <input type="text" id="place_search" name="place_name" placeholder="Type city (e.g. Chennai, Madurai, London)" value="Chennai" required>
                <button type="button" class="search-btn" onclick="searchCity()">Search</button>
            </div>

            <div id="search_results_container">
                <label for="city_select" style="font-weight: normal; margin-top: 8px; font-size: 12px; color: #555;">Select matching city below:</label>
                <select id="city_select" size="4" onchange="applySelectedCity()">
                </select>
            </div>
        </div>

        <div class="form-group">
            <label for="lat">Coordinates / ஆயத்தொலைவுகள்:</label>
            <div class="row-group">
                <input type="text" id="lat" name="lat" placeholder="Latitude" value="13.0827" required readonly>
                <input type="text" id="lon" name="lon" placeholder="Longitude" value="80.2707" required readonly>
            </div>
        </div>

        <div class="form-group">
            <label for="chart_language">Report Language / மொழி:</label>
            <select id="chart_language" name="chart_language">
                <option value="English">English</option>
                <option value="Tamil">Tamil (தமிழ்)</option>
            </select>
        </div>

        <button type="submit" class="submit-btn">Calculate Birth Chart & Dasa Bhukti</button>
    </form>
</div>

<script>
function searchCity() {
    const query = document.getElementById('place_search').value.trim();
    const resultsContainer = document.getElementById('search_results_container');
    const citySelect = document.getElementById('city_select');

    if (query.length < 2) {
        alert("Please enter at least 2 characters to search.");
        return;
    }

    fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=5`)
        .then(res => res.json())
        .then(data => {
            citySelect.innerHTML = '';
            if (data.length > 0) {
                resultsContainer.style.display = 'block';
                data.forEach(item => {
                    const opt = document.createElement('option');
                    opt.value = JSON.stringify({
                        displayName: item.display_name,
                        cityName: item.display_name.split(',')[0],
                        lat: parseFloat(item.lat).toFixed(4),
                        lon: parseFloat(item.lon).toFixed(4)
                    });
                    opt.textContent = item.display_name;
                    citySelect.appendChild(opt);
                });
            } else {
                alert("No cities found for this location search.");
                resultsContainer.style.display = 'none';
            }
        })
        .catch(() => alert("City search failed. Please verify internet connection."));
}

function applySelectedCity() {
    const citySelect = document.getElementById('city_select');
    if (citySelect.value) {
        const selectedData = JSON.parse(citySelect.value);
        document.getElementById('place_search').value = selectedData.cityName;
        document.getElementById('lat').value = selectedData.lat;
        document.getElementById('lon').value = selectedData.lon;
        document.getElementById('search_results_container').style.display = 'none';
    }
}
</script>

</body>
</html>
